<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-light" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>The Kontrolled Khaos</title>
    <link rel="icon" type="image/x-icon" href="/images/kk-favicon.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="DMV-based The Kontrolled Khaos Band (KK) is a powerhouse super-group.">

    <!-- Keywords -->
    <meta name="keywords" content="The Kontrolled Khaos, music, garage soul, DMV">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://yourwebsite.com">

    <!-- Author Information -->
    <meta name="author" content="The Kontrolled Khaos">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/kk-avatar.jpg" srcset="images/kk-avatar@2x.jpg 2x" alt="Kontrolled Khaos">

            <!-- Replace with your name or brand -->
            <h1>
              <div>@KontrolledKhaos</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>DMV-based The Kontrolled Khaos Band (KK) is a powerhouse super-group.</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/_kontrolledkhaos/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- Youtube -->
              <a class="button button-yt" href="https://www.youtube.com/channel/UCn5CkiwW5oxuOT2B7kHadLA/featured" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">Kontrolled Khaos Youtube</a>

              <!-- Spotify -->
              <a class="button button-spotify" href="https://open.spotify.com/artist/2buPQKd5cPRg07JTR5Rrj4" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/spotify.svg" alt="Spotify Logo">Listen on Spotify</a>

              <!-- Apple Music -->
              <a class="button button-apple-music" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/apple-music.svg" alt="Apple Music Logo">Listen on Apple Music</a>
              
              <!-- Bandcamp -->
              <a class="button button-bandcamp" href="https://kontrolledkhaos.bandcamp.com/music" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/bandcamp.svg" alt="Bandcamp Logo">Bandcamp</a>

              <!-- Facebook -->
              <a class="button button-faceb" href="https://www.facebook.com/TheKontrolledKhaos" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="Facebook Logo">The Kontrolled Khaos Facebook Page</a>

              <!-- Kontrolled Khaos Website -->
              <a class="button button-default" href="https://www.thekontrolledkhaos.com/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Homepage Icon">Kontrolled Khaos Website</a>
 
      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="privacy.html">Privacy Policy</a> | Built with <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
